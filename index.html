<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f2f4f7;color:#1a1a1a;font-size:17px}
header{background:#1565c0;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:20px}
main{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
textarea,input,select{width:100%;font-size:18px;padding:12px;border:1px solid #ccd;border-radius:10px;font-family:inherit}
textarea{min-height:120px;resize:vertical}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font-size:17px;min-height:48px;padding:10px 16px;border:0;border-radius:10px;background:#e3e8ef;cursor:pointer}
.primary{background:#1565c0;color:#fff;flex:1;font-weight:600}.mic{background:#d32f2f;color:#fff;min-width:56px}.mic.big{display:flex!important;width:100%;min-height:64px;font-size:22px;font-weight:700;margin-top:10px;border-radius:14px}.mic.on{animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}.chip{min-height:42px;border-radius:21px;padding:8px 14px;background:#e8eef7}.chip.sel{background:#1565c0;color:#fff}
.note{border-left:5px solid #1565c0}.note.done{opacity:.55;border-color:#2e7d32}.note.done .t{text-decoration:line-through}
.meta{font-size:14px;color:#556;margin-bottom:6px}.t{white-space:pre-wrap;word-wrap:break-word}.tag{background:#e8eef7;border-radius:8px;padding:2px 8px;margin-right:4px}
.small{font-size:15px;min-height:44px}#status{font-size:14px;color:#d32f2f;margin-top:6px}.empty{text-align:center;color:#778;padding:20px}
.corr{margin-top:10px;background:#fff8e1;border:1px solid #f0c36d;border-radius:10px;padding:10px}
body{padding-bottom:70px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;box-shadow:0 -1px 4px #0003;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border-radius:0;background:#fff;min-height:60px;font-size:17px;color:#555}#tabs button.act{color:#1565c0;font-weight:700;border-top:3px solid #1565c0}
#tafelFrame{position:fixed;top:0;left:0;width:100%;height:calc(100% - 60px - env(safe-area-inset-bottom));border:0;background:#f3f0f7}
.sel{width:26px;height:26px;vertical-align:middle;margin-right:6px}.orig{background:#f6f6f6;border-radius:8px;padding:8px;margin-top:6px;font-size:15px;color:#444;white-space:pre-wrap}
#printArea{display:none}
@media print{body{background:#fff;padding:0}body>*{display:none!important}#printArea{display:block!important;font-family:Georgia,serif;font-size:16pt;line-height:1.5;color:#000}
#printArea h1{font-size:24pt;margin:0 0 4pt}#printArea .pdate{font-size:12pt;color:#333;margin-bottom:14pt}#printArea h2{font-size:18pt;border-bottom:1.5pt solid #000;margin:16pt 0 6pt;page-break-after:avoid}
#printArea li{margin-bottom:10pt;page-break-inside:avoid}#printArea .pp{font-size:12pt;color:#333}@page{margin:18mm}}
#instBar{position:sticky;top:0;z-index:30;background:#1565c0;padding:8px 10px}
#inst{width:100%;min-height:58px;font-size:clamp(16px,4.6vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;border-radius:14px;color:#fff;background:linear-gradient(90deg,#ff6f00,#e91e63,#8e24aa);box-shadow:0 3px 8px #0004;letter-spacing:.2px}
#instOv{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}#instOv[hidden]{display:none}
.ovbox{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px 18px 22px;position:relative;font-size:18px;line-height:1.45}
.ovx{position:absolute;top:8px;right:8px;min-height:44px;width:44px;border-radius:22px;font-size:20px}
.ovbox h3{margin:14px 0 6px;font-size:20px}.step{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.step .n{flex:0 0 40px;height:40px;border-radius:20px;background:#1565c0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:20px}
.step .k{display:inline-block;border:2px solid #333;border-radius:8px;padding:0 8px;font-weight:800;background:#f5f5f5}.arrow{font-size:26px;text-align:center;color:#e91e63;margin:-4px 0}
body.hasBar header{top:var(--bh,74px)}body.hasBar #tafelFrame{top:var(--bh,74px);height:calc(100% - var(--bh,74px) - 60px - env(safe-area-inset-bottom))}
</style>

<body>
<div id="instBar"><button id="inst" type="button">📲 Symbol auf Startbildschirm legen</button></div>
<div id="instOv" hidden><div class="ovbox"><button id="instX" class="ovx" type="button" aria-label="Schließen">✕</button><div id="instHelp"></div></div></div>
<div id="tabNotes">
<header><h1>📝 Arbeitsnotizen <small style="font-size:12px;opacity:.8">v2.0 (23.10.2026)</small></h1></header>
<div id="upd" hidden style="background:#ffeb3b;padding:12px;text-align:center;font-weight:700;cursor:pointer">🔄 Neue Version verfügbar – hier tippen zum Aktualisieren</div>
<main>
<section class="card">
<textarea id="text" placeholder="Notiz eingeben… z. B. „Mitarbeiter braucht Schulung für die Anlage“"></textarea>
<button class="mic big" id="mic" type="button" title="Diktieren">🎤 Diktieren</button>
<div id="status"></div>
<div id="corr" class="corr" hidden><div class="meta" id="corrText"></div>
<div class="row"><button class="small" id="corrUndo" type="button">↩ Rückgängig</button><button class="small" id="corrNo" type="button">✕ Schließen</button></div>
<div class="meta" style="font-size:12px;margin:6px 0 0">Hinweis: Zum Umformulieren wird der Text an einen externen Dienst (Pollinations / LanguageTool) gesendet.</div></div>
<input id="person" placeholder="Person (optional)" style="margin-top:10px">
<div class="row" id="chips"></div>
<div class="row"><button id="fix" type="button">✍️ Umformulieren</button><button class="primary" id="save">Speichern</button></div>
</section>
<section class="card">
<input id="search" type="search" placeholder="🔍 Suchen…">
<div class="row"><select id="fcat"><option value="">Alle Kategorien</option></select>
<select id="fstat"><option value="">Alle</option><option value="offen">Offen</option><option value="erledigt">Erledigt</option></select></div>
<div class="row"><input id="ptitle" placeholder="Titel für Druck (z. B. Schulung Anlage)" value="Schulung"></div>
<div class="row"><button id="selAll" class="small">☑ Alle auswählen</button><button id="selNone" class="small">☐ Auswahl aufheben</button></div>
<div class="row"><button id="rwAll" class="small">✍️ Alle umformulieren</button><button id="spAll" class="small">🔊 Alle vorlesen</button><button id="spStop" class="small">⏹ Stopp</button><button id="prt" class="small">🖨 Drucken</button></div>
<div class="small" id="rwProg" style="font-size:14px;color:#556"></div>
<div class="small" style="font-size:13px;color:#778">Gilt für ausgewählte Notizen (☑), sonst für alle angezeigten.</div>
<div class="row"><button id="csv" class="small">⬇ CSV-Export</button><button id="copy" class="small">📋 Als Text kopieren</button></div>
</section>
<div id="list"></div>
</main>
</div>
<iframe id="tafelFrame" title="Tafel-Finder" hidden></iframe>
<div id="printArea"></div>
<nav id="tabs"><button id="tbN" class="act">📝 Notizen</button><button id="tbT">🔍 Tafel-Finder</button></nav>
<script>
(function(){
"use strict";
var CATS=["Schulung","Anlage","Mitarbeiter","Aufgabe","Sonstiges"],KEY="arbeitsnotizen_v1";
var $=function(id){return document.getElementById(id);};
var notes=[];try{notes=JSON.parse(localStorage.getItem(KEY))||[];}catch(e){notes=[];}
var selCats=[];
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));}
function fmt(ts){return new Date(ts).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
// chips
CATS.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.type="button";
b.onclick=function(){var i=selCats.indexOf(c);if(i<0)selCats.push(c);else selCats.splice(i,1);b.classList.toggle("sel");};
$("chips").appendChild(b);var o=document.createElement("option");o.value=c;o.textContent=c;$("fcat").appendChild(o);});
// save
$("save").onclick=function(){var t=$("text").value.trim();if(!t){$("text").focus();return;}
notes.unshift({id:Date.now()+""+Math.random().toString(36).slice(2,6),text:t,person:$("person").value.trim(),cats:selCats.slice(),ts:Date.now(),done:false});
persist();$("corr").hidden=true;$("text").value="";$("person").value="";selCats=[];document.querySelectorAll(".chip.sel").forEach(function(b){b.classList.remove("sel");});render();};
function filtered(){var q=$("search").value.toLowerCase(),fc=$("fcat").value,fs=$("fstat").value;
return notes.filter(function(n){if(fc&&n.cats.indexOf(fc)<0)return false;if(fs==="offen"&&n.done)return false;if(fs==="erledigt"&&!n.done)return false;
return !q||(n.text+" "+n.person+" "+n.cats.join(" ")).toLowerCase().indexOf(q)>=0;});}
function render(){var l=filtered(),h="";
if(!l.length)h='<div class="empty">Keine Notizen.</div>';
l.forEach(function(n){h+='<div class="card note'+(n.done?' done':'')+'"><div class="meta"><input type="checkbox" class="sel" data-id="'+n.id+'"'+(n.sel?' checked':'')+' aria-label="Auswählen">🕒 '+fmt(n.ts)+(n.person?' · 👤 '+esc(n.person):'')+'</div>'+
(n.cats.length?'<div class="meta">'+n.cats.map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join("")+'</div>':'')+
'<div class="t">'+esc(n.text)+'</div>'+(n.orig&&n.showOrig?'<div class="orig">Original: '+esc(n.orig)+'</div>':'')+
'<div class="row"><button class="small" data-a="rw" data-id="'+n.id+'">✍️ Umformulieren</button><button class="small" data-a="sp" data-id="'+n.id+'">🔊 Vorlesen</button></div>'+
(n.orig?'<div class="row"><button class="small" data-a="so" data-id="'+n.id+'">'+(n.showOrig?'🙈 Original ausblenden':'👁 Original anzeigen')+'</button><button class="small" data-a="undo" data-id="'+n.id+'">↩ Rückgängig</button></div>':'')+
'<div class="row"><button class="small" data-a="done" data-id="'+n.id+'">'+(n.done?'↩ Wieder offen':'✔ Erledigt')+'</button>'+
'<button class="small" data-a="del" data-id="'+n.id+'">🗑 Löschen</button></div></div>';});
$("list").innerHTML=h;}
$("list").onchange=function(e){if(e.target.classList.contains("sel")){var n=notes.find(function(x){return x.id===e.target.dataset.id;});if(n){n.sel=e.target.checked;persist();}}};
$("list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var n=notes.find(function(x){return x.id===b.dataset.id;});if(!n)return;
var a=b.dataset.a;if(a==="rw"){rewriteNotes([n]);return;}if(a==="sp"){speak([n]);return;}if(a==="so"){n.showOrig=!n.showOrig;persist();render();return;}
if(a==="undo"){if(n.orig&&confirm("Originaltext wiederherstellen?")){n.text=n.orig;delete n.orig;n.showOrig=false;persist();render();}return;}
if(a==="done")n.done=!n.done;else if(confirm("Notiz wirklich löschen?"))notes=notes.filter(function(x){return x!==n;});persist();render();};
["search","fcat","fstat"].forEach(function(id){$(id).addEventListener("input",render);});
// export
$("csv").onclick=function(){var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
var rows=[["Datum","Person","Kategorien","Notiz","Status"]].concat(filtered().map(function(n){return[fmt(n.ts),n.person,n.cats.join(", "),n.text,n.done?"erledigt":"offen"];}));
var csv="\ufeff"+rows.map(function(r){return r.map(q).join(";");}).join("\r\n");
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="notizen_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();};
$("copy").onclick=function(){var txt=filtered().map(function(n){return(n.done?"[x] ":"[ ] ")+fmt(n.ts)+(n.person?" – "+n.person:"")+(n.cats.length?" ("+n.cats.join(", ")+")":"")+"\n"+n.text;}).join("\n\n");
var ok=function(){$("copy").textContent="✅ Kopiert";setTimeout(function(){$("copy").textContent="📋 Als Text kopieren";},1500);};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb();
function fb(){var t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok();}catch(e){alert(txt);}t.remove();}};

// Korrektur
function lev(a,b){var d=[],i,j;for(i=0;i<=a.length;i++)d[i]=[i];for(j=0;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function applyLT(text,matches){var ms=matches.filter(function(m){if(!(m.replacements&&m.replacements.length))return false;if(m.rule&&/SPELLER/.test(m.rule.id)){var o=text.substr(m.offset,m.length).toLowerCase();return m.replacements.some(function(r){return r.value.toLowerCase()===o||(o.length<=8&&lev(r.value.toLowerCase(),o)<=1&&r.value.length>=o.length);});}return true;}).sort(function(a,b){return b.offset-a.offset;});
var out=text,lastStart=Infinity;ms.forEach(function(m){if(m.offset+m.length>lastStart)return;var orig=text.substr(m.offset,m.length),rep=m.replacements.find(function(r){return r.value.toLowerCase()===orig.toLowerCase();})||m.replacements.find(function(r){return lev(r.value.toLowerCase(),orig.toLowerCase())<=1&&r.value.length>=orig.length;})||m.replacements[0];out=out.slice(0,m.offset)+rep.value+out.slice(m.offset+m.length);lastStart=m.offset;});
out=out.trim().replace(/\s+/g," ");if(out)out=out.charAt(0).toUpperCase()+out.slice(1);if(out&&!/[.!?…:]$/.test(out))out+=".";return out;}
window.__applyLT=applyLT;
var origText="",busy=false;
var SYS="Du bist Korrektor für Arbeitsnotizen aus einem Industriebetrieb (Fertigung, Großpresserei, Strahlanlage). Der Text wurde per Spracherkennung diktiert: Er ist umgangssprachlich und enthält Füllwörter und falsch erkannte Wörter. Wandle ihn in präzises, korrektes Schriftdeutsch um – so wie man schreibt, nicht wie man spricht.\nRegeln:\n- Füllwörter, Wiederholungen und Umgangssprache entfernen (z. B. also, äh, ähm, ja, halt, eben, sozusagen, quasi, ne, gell, irgendwie, gucken → prüfen/kontrollieren).\n- Falsch erkannte oder getrennte Wörter aus dem Zusammenhang korrigieren. Typische Fachbegriffe: Strahlanlage, strahlen, Werkzeug, Werkzeugnummer, Auftrag, FAUF (Fertigungsauftrag), AVO (Arbeitsvorgang), Fertigungsbegleitblatt, Schicht, Schichtführer, beizen, Beize, Ronde, Ring, Vorform, Presse, Charge, Stückzahl, sperren, Prüfung.\n- Vollständige, grammatisch korrekte Sätze mit richtiger Zeichensetzung; Anweisungen klar formulieren (z. B. „Vor dem Einschalten … prüfen“).\n- Alle Fakten, Namen, Nummern, Mengen und Werte unverändert übernehmen. Nichts erfinden, nichts weglassen, was inhaltlich wichtig ist.\n- Kurz und sachlich bleiben.\nAntworte ausschließlich mit dem fertigen Text – ohne Einleitung, Erklärung oder Anführungszeichen.\nBeispiele:\nEingabe: also äh wenn man die strahl anlage halt anmacht muss man ja erst gucken ob der druck passt\nAusgabe: Vor dem Einschalten der Strahlanlage muss der Druck geprüft werden.\nEingabe: die ronden von dem auftrag die können jetzt zum beizen ne\nAusgabe: Die Ronden dieses Auftrags können jetzt gebeizt werden.\nEingabe: der klaus braucht noch ne einweisung an der presse weil der neu ist\nAusgabe: Klaus benötigt noch eine Einweisung an der Presse, da er neu ist.\nVerwende Standardwörter: „einschalten“ statt „anmachen“, „prüfen“ statt „gucken“, „benötigt“ statt „braucht“, „gebeizt“ (nicht „beizt“). Schreibe Fachbegriffe als ein Wort (Strahlanlage, Schichtführer).";
function postFix(c){return c.replace(/\bStrahl[- ]?[Aa]nlage/g,"Strahlanlage").replace(/\bStrahlen[- ]?lage\b/g,"Strahlanlage").replace(/\bSchicht[- ][Ff]ührer/g,"Schichtführer");}
function withTimeout(pr,ms){return Promise.race([pr,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"));},ms);})]);}
function llm(t,sys){return withTimeout(fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({model:"openai",messages:[{role:"system",content:sys||SYS},{role:"user",content:t}]})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.then(function(d){var c=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim().replace(/^["„“»]+|["“”«]+$/g,"").trim();
if(!c||c.length>t.length*3+80)throw new Error("bad");return postFix(c);}),45000);}
function lt(t){return withTimeout(fetch("https://api.languagetool.org/v2/check",{method:"POST",body:new URLSearchParams({text:t,language:"de-DE"})})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){return applyLT(t,d.matches||[]);}),15000);}
function correct(){var t=$("text").value.trim();if(!t||busy)return;$("corr").hidden=false;$("corrUndo").hidden=true;
if(!navigator.onLine){$("corrText").textContent="Offline – Umformulieren nicht möglich.";return;}
busy=true;$("corrText").textContent="⏳ Wird umformuliert…";$("fix").disabled=true;
function done(c,src){busy=false;$("fix").disabled=false;if($("text").value.trim()!==t){$("corr").hidden=true;return;}
if(c===t){$("corrText").textContent="✅ Keine Änderungen nötig.";return;}
origText=t;$("text").value=c;$("corrUndo").hidden=false;$("corrText").textContent="✅ Text "+src+" eingefügt. Original: „"+t+"“";}
llmRetry(t,SYS).then(function(c){done(c,"umformuliert (KI) und");},function(){return lt(t).then(function(c){done(c,"korrigiert (LanguageTool, KI nicht erreichbar) und");});})
.catch(function(){busy=false;$("fix").disabled=false;$("corrText").textContent="Dienst nicht erreichbar – Text bleibt unverändert.";});}
$("fix").onclick=correct;
$("corrUndo").onclick=function(){if(origText)$("text").value=origText;$("corr").hidden=true;};
$("corrNo").onclick=function(){$("corr").hidden=true;};
$("text").addEventListener("input",function(){if(!busy)$("corr").hidden=true;});
// speech
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false;
if(!SR){$("mic").onclick=function(){$("status").textContent="Diktieren direkt in der App geht in diesem Browser nicht (z. B. iPhone-App vom Home-Bildschirm oder Firefox). Bitte ins Textfeld tippen und die 🎤-Taste der Tastatur benutzen – danach „✍️ Umformulieren“ drücken. Tipp: In Chrome (Android) bzw. Safari funktioniert der Knopf.";$("text").focus();};}
else{rec=new SR();rec.lang="de-DE";rec.continuous=true;rec.interimResults=true;var base="";
rec.onresult=function(e){var fin="",tmp="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else tmp+=e.results[i][0].transcript;}
if(fin)base=(base?base+" ":"")+fin.trim();$("text").value=base+(tmp?" "+tmp:"");};
rec.onerror=function(e){$("status").textContent=e.error==="not-allowed"?"Mikrofonzugriff verweigert.":"Fehler bei Spracheingabe: "+e.error;};
rec.onend=function(){var was=on;on=false;$("mic").textContent="🎤 Diktieren";if(was)setTimeout(correct,300);$("mic").classList.remove("on");$("mic").textContent="🎤 Diktieren";};
$("mic").onclick=function(){if(on){rec.stop();return;}base=$("text").value.trim();$("status").textContent="";try{rec.start();on=true;$("mic").classList.add("on");$("mic").textContent="⏹ Stopp";}catch(e){$("status").textContent="Spracheingabe konnte nicht gestartet werden.";}};}
render();

// ---- Schulung: umformulieren, vorlesen, drucken ----
var SYS_TRAIN=SYS;
function targets(){var l=filtered(),s=l.filter(function(n){return n.sel;});return s.length?s:l;}
var rwBusy=false;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function llmRetry(t,sys,cb){for(var k=1;k<=3;k++){cb&&cb(k);try{return await llm(t,sys);}catch(e){if(k===3)throw e;await sleep(4000*k);}}}
async function rewriteNotes(list){if(rwBusy)return;if(!navigator.onLine){$("rwProg").textContent="Offline – Umformulieren nicht möglich.";return;}rwBusy=true;var ok=0,fb=0,err=0;
 for(var i=0;i<list.length;i++){var n=list[i],t=n.text;$("rwProg").textContent="⏳ Umformulieren "+(i+1)+"/"+list.length+" …";var c=null;
  try{c=await llmRetry(t,SYS_TRAIN,function(k){$("rwProg").textContent="⏳ Umformulieren "+(i+1)+"/"+list.length+" … (Versuch "+k+"/3)";});}catch(e){try{c=await lt(t);fb++;}catch(e2){err++;}}
  if(c&&c!==t){if(!n.orig)n.orig=t;n.text=c;ok++;persist();render();}}
 rwBusy=false;$("rwProg").textContent="✅ Fertig: "+ok+" umformuliert"+(fb?" ("+fb+" nur korrigiert, KI nicht erreichbar)":"")+(err?", "+err+" fehlgeschlagen":"")+". Originale bleiben erhalten (↩ Rückgängig).";}
$("rwAll").onclick=function(){var l=targets();if(!l.length)return;if(confirm(l.length+" Notiz(en) umformulieren? Das Original bleibt gespeichert."))rewriteNotes(l);};
function speak(list){if(!("speechSynthesis" in window)){alert("Vorlesen wird von diesem Browser nicht unterstützt.");return;}speechSynthesis.cancel();
 var v=speechSynthesis.getVoices().filter(function(x){return /^de/i.test(x.lang);})[0];
 list.forEach(function(n){var u=new SpeechSynthesisUtterance(n.text);u.lang="de-DE";if(v)u.voice=v;u.rate=0.95;speechSynthesis.speak(u);});}
$("spAll").onclick=function(){speak(targets());};$("spStop").onclick=function(){if("speechSynthesis" in window)speechSynthesis.cancel();};
$("selAll").onclick=function(){filtered().forEach(function(n){n.sel=true;});persist();render();};
$("selNone").onclick=function(){notes.forEach(function(n){n.sel=false;});persist();render();};
function buildPrint(list){var g={},order=["Schulung","Anlage","Mitarbeiter","Aufgabe","Sonstiges","Ohne Kategorie"];
 list.forEach(function(n){var c=n.cats&&n.cats.length?n.cats[0]:"Ohne Kategorie";(g[c]=g[c]||[]).push(n);});
 var h='<h1>'+esc($("ptitle").value.trim()||"Schulung")+'</h1><div class="pdate">Datum: '+new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})+'</div>';
 order.concat(Object.keys(g).filter(function(k){return order.indexOf(k)<0;})).forEach(function(c){if(!g[c])return;
  h+='<h2>'+esc(c)+'</h2><ol>'+g[c].slice().reverse().map(function(n){return '<li>'+esc(n.text)+(n.person?'<div class="pp">Person: '+esc(n.person)+'</div>':'')+'</li>';}).join("")+'</ol>';});
 $("printArea").innerHTML=h;}
$("prt").onclick=function(){var l=targets();if(!l.length){alert("Keine Notizen zum Drucken.");return;}buildPrint(l);setTimeout(function(){window.print();},50);};
window.__buildPrint=buildPrint;
// Version / Update
var APPV=document.querySelector('meta[name="app-version"]').content;
function checkUpd(){fetch("./?nocache="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(h){var m=h.match(/name="app-version" content="([^"]+)"/);if(m&&m[1]!==APPV)$("upd").hidden=false;}).catch(function(){});}
$("upd").onclick=function(){location.replace(location.pathname+"?v="+Date.now()+location.hash);};
checkUpd();document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpd();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});
// Installieren

if(standalone){$("instBar").hidden=true;}else{document.body.classList.add("hasBar");var setBH=function(){document.body.style.setProperty("--bh",$("instBar").offsetHeight+"px");};setBH();window.addEventListener("resize",setBH);}
window.addEventListener("appinstalled",function(){showOv('<h3>✅ Fertig!</h3><p>Das Symbol <b>„Arbeitsapp“</b> liegt jetzt auf dem Startbildschirm. Ab jetzt die App dort öffnen.</p>');});

var IOS='<h3>🍎 iPhone / iPad (Safari)</h3>'+st(1,'Diese Seite in <b>Safari</b> öffnen (nicht Chrome).')+AR+st(2,'Unten in der Leiste auf <span class="k">⬆️ Teilen</span> tippen (Viereck mit Pfeil nach oben).')+AR+st(3,'Etwas nach unten wischen und <b>„Zum Home-Bildschirm“</b> ➕ antippen.')+AR+st(4,'Oben rechts auf <b>„Hinzufügen“</b> tippen. Fertig – Symbol „Arbeitsapp“ 📝🔍.');
var AND='<h3>🤖 Android – Chrome</h3>'+st(1,'Oben rechts auf <span class="k">⋮</span> (drei Punkte) tippen.')+AR+st(2,'<b>„App installieren“</b> oder <b>„Zum Startbildschirm hinzufügen“</b> wählen.')+AR+st(3,'<b>„Installieren“</b> bzw. <b>„Hinzufügen“</b> bestätigen.')+
 '<h3>📱 Samsung Internet</h3>'+st(1,'Unten rechts auf <span class="k">☰</span> (Menü) tippen.')+AR+st(2,'<b>„Seite hinzufügen zu“</b> → <b>„Startbildschirm“</b>.')+AR+st(3,'<b>„Hinzufügen“</b> bestätigen.');
$("inst").onclick=function(){if(deferredPrompt){var d=deferredPrompt;deferredPrompt=null;d.prompt();d.userChoice.then(function(c){if(c&&c.outcome!=="accepted")showOv('<p>Kein Problem – so geht es auch von Hand:</p>'+AND);});return;}
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 showOv('<h2 style="margin:0 0 4px">📲 Symbol auf den Startbildschirm</h2><p style="margin:0;color:#555">Danach öffnet sich die App wie eine normale App – auch ohne Internet.</p>'+(ios?IOS+'<hr>'+AND:AND+'<hr>'+IOS));};
// Tabs
function tab(t){var T=t==="tafel";$("tabNotes").hidden=T;$("tafelFrame").hidden=!T;if(T&&!$("tafelFrame").src)$("tafelFrame").src="finder/?v="+encodeURIComponent(APPV);
 $("tbN").classList.toggle("act",!T);$("tbT").classList.toggle("act",T);localStorage.setItem("arbeit_tab",t);}

tab(localStorage.getItem("arbeit_tab")==="tafel"||location.hash==="#tafel"?"tafel":"notes");
})();
